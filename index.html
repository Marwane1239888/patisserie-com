A.print=id=>pr([S.orders.find(o=>o.id==id)]);
A.del=id=>ask(t('sure'),async()=>{await del('orders',id);S.orders=await all('orders')});
A.pay=async id=>{const o=S.orders.find(o=>o.id==id);o.deposit=tot(o);await put('orders',o);render()};
A.yes=async()=>{await S.cb();A.x()};A.x=()=>{S.modal='';render()};A.f=id=>{S.f=id;render()};
A.padd=()=>{S.pf={name:'',cat:'',desc:'',price:0,unit:'pièce',img:''};S.modal=pform();render()};
A.pedit=id=>{S.pf={...S.products.find(p=>p.id==id)};S.modal=pform();render()};
A.psave=async()=>{const p=S.pf;if(!p.name.trim()||!(p.price>0))return toast(t('err'));if(!p.id)p.id=uid();await put('products',p);S.products=await all('products');A.x()};
A.pdel=id=>ask(t('sure'),async()=>{await del('products',id);S.products=await all('products')});
A.calc=()=>{S.modal=calcM();render()};
A.k=k=>{if(k=='C')S.calc='';else if(k=='⌫')S.calc=S.calc.slice(0,-1);else if(k=='='){try{if(!/^[\d+\-*/.()% ]+$/.test(S.calc))throw 0;S.calc=String(Math.round(Function('return('+S.calc.replace(/(\d+\.?\d*)%/g,'($1/100)')+')')()*1e8)/1e8)}catch{S.calc='Err'}}else S.calc=(S.calc=='Err'?'':S.calc)+k;$('#cd').textContent=S.calc||'0'};
A.rp=()=>{const l=rng().filter(live);l.length?pdf(l,0,'factures-'+S.from+'_'+S.to+'.pdf'):toast(t('none'))};
A.csv=()=>dlf('rapport-'+S.from+'_'+S.to+'.csv','\ufeffN°;Date;Client;Tél;Statut;Total;Payé;Reste\n'+rng().map(o=>[o.no,o.date,o.name,o.phone,t('st_'+o.status),tot(o),+o.deposit||0,bal(o)].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n'));
A.bk=()=>dlf('sauvegarde-'+T()+'.json',JSON.stringify({products:S.products,orders:S.orders,coffees:S.coffees,sales:S.sales,set:S.set}));
A.th=id=>{S.set.theme=id;put('kv',S.set);render()};A.thr=()=>{S.set.theme='';S.set.tc={};put('kv',S.set);render()};A.ivr=()=>{S.set.iv={};put('kv',S.set);render()};
A.pdf1=id=>{const o=S.orders.find(o=>o.id==id);pdf([o],0,o.no+'.pdf')};A.cpdf=id=>{const s=S.sales.find(s=>s.id==id);pdf([s],1,s.no+'.pdf')};
A.dk=()=>{S.set.theme=S.set.theme=='dark'?'cream':'dark';put('kv',S.set);render()};
A.lang=id=>{S.set.lang=id;put('kv',S.set);render()};A.lk=()=>A.logout();
A.authmode=id=>{if(id==='signup'&&!ALLOW_SIGNUP)return toast('Les inscriptions sont fermées');S.authMode=id;render()};
A.authsubmit=async()=>{try{const email=$('#auth-email').value.trim(),password=$('#auth-password').value;if(!email||!password)return toast('Saisissez votre e-mail et votre mot de passe');if(S.authMode==='signup'){if(password.length<8)return toast('Mot de passe : 8 caractères minimum');const {data,error}=await client.auth.signUp({email,password});if(error)throw error;if(!data.session)toast('Compte créé. Vérifiez votre e-mail puis connectez-vous.');else toast('Compte créé avec succès');}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;}}catch(e){toast(e.message||'Erreur de connexion')}};
A.logout=async()=>{try{await client.auth.signOut()}catch(e){toast(e.message)}};
A.unlock=async()=>{const v=$('#pin').value;if(v.length<4)return toast(t('setpin'));if(!S.set.pin){S.set.pin=await sha(v);await put('kv',S.set);S.ok=true}else if(await sha(v)==S.set.pin)S.ok=true;else return toast(t('bad'));render()};
async function load(){S.products=await all('products');S.orders=await all('orders');S.coffees=await all('coffees');S.sales=await all('sales');S.set=(await all('kv'))[0]||{id:'set',shop:'Ma Pâtisserie',lang:'fr',seq:0}}
function watchSharedData(){if(syncChannel)client.removeChannel(syncChannel);syncChannel=client.channel('shared-patisserie-'+STORE_ID).on('postgres_changes',{event:'*',schema:'public',table:'app_data',filter:'store_id=eq.'+STORE_ID},()=>{clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{if(!S.ok)return;try{await load();render()}catch(e){toast('Erreur de synchronisation')}} ,350)}).subscribe();}
async function applySession(session){if(session?.user){S.user=session.user;S.ok=true;if(S.loadedUser!==session.user.id){try{await load();S.loadedUser=session.user.id;watchSharedData();render()}catch(e){S.loadedUser=null;S.ok=false;toast('Base de données : '+(e.message||'vérifiez le SQL'));render()}}else render()}else{S.user=null;S.loadedUser=null;S.ok=false;if(syncChannel){client.removeChannel(syncChannel);syncChannel=null}render()}}
async function startApp(){if(!window.supabase||SUPABASE_URL.includes('PASTE_')||SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')){$('#app').innerHTML='<main class=card><h2>Configuration nécessaire</h2><p>Ajoutez l’URL du projet Supabase et la clé Publishable dans les trois constantes au début du script, puis rechargez la page.</p></main>';return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});client.auth.onAuthStateChange((event,session)=>{setTimeout(()=>applySession(session),0)});const {data,error}=await client.auth.getSession();if(error)throw error;await applySession(data.session)}
async function restore(f){try{const j=JSON.parse(await f.text());for(const p of j.products||[])await put('products',p);for(const o of j.orders||[])await put('orders',o);for(const c of j.coffees||[])await put('coffees',c);for(const s of j.sales||[])await put('sales',s);if(j.set)await put('kv',j.set);await load();render();toast('✓')}catch(e){toast(e.message||t('err'))}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset.id,b)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pin')A.unlock()});
document.addEventListener('input',e=>{const x=e.target,d=x.dataset,v=x.type=='number'?+x.value:x.value;
if(d.i){if(['sq','pq','dd','from','to','cd'].includes(d.i)){S[d.i]=v;render();if(d.i=='sq'||d.i=='pq'){const el=$(`[data-i=${d.i}]`);el.focus();el.setSelectionRange(v.length,v.length)}}else{d.k!=null?S.dr.items[d.k][d.i]=v:S.dr[d.i]=v;upd()}}
else if(d.p)S.pf[d.p]=v;else if(d.s){S.set[d.s]=v;put('kv',S.set)}else if(d.t){S.set.tc={...S.set.tc,[d.t]:v};put('kv',S.set);applyTheme()}else if(d.v){S.set.iv={...S.set.iv,[d.v]:x.type=='checkbox'?x.checked:d.v=='fs'?+v:v};put('kv',S.set);x.type=='checkbox'?render():applyTheme()}
else if(d.qc!=null){const [a,b]=document.querySelectorAll('[data-qc]');$('#qr').textContent=fm(a.value*b.value)}});
document.addEventListener('change',async e=>{const x=e.target,d=x.dataset;
if(d.c=='st'){const o=S.orders.find(o=>o.id==d.id);o.status=x.value;await put('orders',o);render()}
else if(d.c=='pid'){const it=S.dr.items[d.k],p=S.products.find(p=>p.id==x.value);Object.assign(it,p?{pid:p.id,name:p.name,img:p.img||'',price:p.price}:{pid:'',name:'',img:'',price:0});render()}
else if(d.c=='photo'){S.pf.img=await shrink(x.files[0]);$('#pimg').src=S.pf.img}
else if(d.c=='logo'){S.set.logo=await shrink(x.files[0],200);await put('kv',S.set);render()}
else if(d.c=='restore')restore(x.files[0])});
(async()=>{try{await startApp()}catch(e){$('#app').innerHTML='<main class=card><h2>Erreur de démarrage</h2><p>'+esc(e.message||'Réessayez')+'</p></main>'}})();
</script></body></html>
