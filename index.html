const saveOrder=async p=>{const d=S.dr;d.name=d.name.trim();d.items=d.items.filter(i=>i.name.trim()&&+i.qty>0);if(!d.name||!d.items.length)return toast(t('err'));const isNew=!d.id;if(isNew){d.id=uid();d.ts=Date.now();d.no='CMD-'+String(S.orders.length+1).padStart(4,'0')}await put('orders',d);if(isNew)S.orders.push(d);else S.orders=S.orders.map(o=>o.id==d.id?d:o);S.v='orders';S.dr=null;render();toast(t('save'));if(p)pr([d])},
saveProd=async()=>{const p=S.pf;p.name=p.name.trim();if(!p.name)return toast(t('cerr'));p.price=+p.price||0;const isNew=!p.id;if(isNew)p.id=uid();await put('products',p);if(isNew)S.products.push(p);else S.products=S.products.map(x=>x.id==p.id?p:x);S.modal='';S.pf=null;render();toast(t('save'))},
saveSale=async p=>{if(!S.tk.length)return;const s={id:uid(),no:'CAF-'+String(S.sales.length+1).padStart(4,'0'),date:T(),time:new Date().toTimeString().slice(0,5),ts:Date.now(),items:S.tk.map(x=>({...x})),total:S.tk.reduce((a,i)=>a+i.qty*i.price,0)};await put('sales',s);S.sales.push(s);S.tk=[];render();toast(t('enc'));if(p)prt(s)},
saveSet=async()=>{S.set.id='main';await put('kv',S.set);applyTheme()},
loadAll=async()=>{const [prds,ords,kvs,cfs,sls]=await Promise.all([all('products'),all('orders'),all('kv'),all('coffees'),all('sales')]);S.products=prds;S.orders=ords;const kvMain=kvs.find(x=>x.id=='main');S.set=kvMain?{shop:'Pâtisserie',msg:'',...kvMain}:{shop:'Pâtisserie',msg:''};S.coffees=cfs;S.sales=sls};
let pullTimer=null;
const refreshFromCloud=async()=>{if(!S.user||!client)return;try{await loadAll();render()}catch(e){console.error(e)}};
const scheduleCloudRefresh=()=>{clearTimeout(pullTimer);pullTimer=setTimeout(refreshFromCloud,250)};
const subscribeSync=()=>{if(syncChannel){client.removeChannel(syncChannel);syncChannel=null}if(!S.user||!client)return;syncChannel=client.channel('patisserie-sync-'+STORE_ID).on('postgres_changes',{event:'*',schema:'public',table:'app_data',filter:'store_id=eq.'+STORE_ID},()=>scheduleCloudRefresh()).subscribe()};
const startAppForUser=async user=>{if(!user)return;S.user=user;S.ok=true;if(S.loadedUser!==user.id){await loadAll();S.loadedUser=user.id}subscribeSync();render()};
const stopAppForUser=()=>{if(syncChannel){client.removeChannel(syncChannel);syncChannel=null}S.user=null;S.ok=false;S.loadedUser=null;render()};
const initSupabase=async()=>{await dbo();if(!SUPABASE_URL||SUPABASE_URL.includes('PASTE_')||!SUPABASE_PUBLISHABLE_KEY||SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')){$('#app').innerHTML=`<main><div class="card warn"><h2>Configuration nécessaire</h2><p>Ajoutez l'URL du projet Supabase et la clé Publishable dans les trois constantes au début du script, puis rechargez la page.</p></div></main>`;return}if(!window.supabase?.createClient){$('#app').innerHTML=`<main><div class="card warn"><h2>Bibliothèque Supabase indisponible</h2><p>Vérifiez votre connexion internet et rechargez la page.</p></div></main>`;return}client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data:{session}}=await client.auth.getSession();if(session?.user)await startAppForUser(session.user);else render();client.auth.onAuthStateChange(async(_ev,sess)=>{if(sess?.user)await startAppForUser(sess.user);else stopAppForUser()})};
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,k=+b.dataset.k;
if(a=='authmode'){S.authMode=id=='signup'?'signup':'login';render();return}
if(a=='authsubmit'){const email=($('#auth-email')?.value||'').trim(),password=$('#auth-password')?.value||'';if(!email||password.length<8)return toast('E-mail et mot de passe (8 caractères min.) requis');b.disabled=true;try{if(S.authMode=='signup'){const {data,error}=await client.auth.signUp({email,password});if(error)throw error;toast(data.session?'Compte créé':'Vérifiez votre e-mail pour confirmer le compte');if(data.session&&data.user)await startAppForUser(data.user)}else{const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(data.user)await startAppForUser(data.user)}}catch(err){toast(err?.message||'Erreur d’authentification')}finally{b.disabled=false}return}
if(a=='logout'){await client.auth.signOut();stopAppForUser();return}
if(!S.ok)return;
if(a=='go'){S.v=id;if(id=='form'&&!S.dr)S.dr=blank();render()}
else if(a=='dk'){document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'}
else if(a=='new'){S.dr=blank();S.v='form';render()}
else if(a=='addp'){S.dr.items.push({pid:'',name:'',img:'',qty:1,price:0});render()}
else if(a=='rm'){S.dr.items.splice(k,1);if(!S.dr.items.length)S.dr.items.push({pid:'',name:'',img:'',qty:1,price:0});render()}
else if(a=='save')await saveOrder(0);else if(a=='savep')await saveOrder(1);
else if(a=='f'){S.f=id;render()}
else if(a=='edit'){const o=S.orders.find(x=>x.id==id);if(o){S.dr=JSON.parse(JSON.stringify(o));S.v='form';render()}}
else if(a=='pay'){const o=S.orders.find(x=>x.id==id);if(o){o.deposit=tot(o);await put('orders',o);render();toast('✓')}}
else if(a=='del')ask(t('sure'),async()=>{await del('orders',id);S.orders=S.orders.filter(x=>x.id!=id);S.modal='';render()});
else if(a=='inv'){const o=S.orders.find(x=>x.id==id);if(o){S.modal=`${inv(o)}<div class=acts><button class=gold data-a=pr id=${o.id}>🖨 ${t('print')}</button><button class="btn gold" data-a=wa id=${o.id}>WhatsApp</button><button data-a=x>${t('close')}</button></div>`;render()}}
else if(a=='pr'){const o=S.orders.find(x=>x.id==id);if(o)pr([o])}
else if(a=='wa'){const o=S.orders.find(x=>x.id==id);if(o)open(wa(o),'_blank')}
else if(a=='x'){S.modal='';S.pf=null;render()}else if(a=='yes'){if(S.cb)await S.cb();S.modal='';render()}
else if(a=='padd'){S.pf={name:'',cat:'',desc:'',price:0,unit:'pièce',img:''};S.modal=pform();render()}
else if(a=='pedit'){const p=S.products.find(x=>x.id==id);if(p){S.pf={...p};S.modal=pform();render()}}
else if(a=='psave')await saveProd();
else if(a=='pdel')ask(t('sure'),async()=>{await del('products',id);S.products=S.products.filter(x=>x.id!=id);S.modal='';render()});
else if(a=='lang'){S.set.lang=id;await saveSet();render()}
else if(a=='th'){S.set.theme=id;await saveSet();render()}
else if(a=='thr'){delete S.set.theme;delete S.set.tc;await saveSet();render()}
else if(a=='ivr'){delete S.set.iv;await saveSet();render()}
else if(a=='rp'){const l=rng().filter(live);if(!l.length)return;pr(l)}
else if(a=='csv'){const l=rng().filter(live),rows=[['N°','Date','Client','Téléphone','Statut','Total','Acompte','Reste']];l.forEach(o=>rows.push([o.no,o.date,o.name,o.phone,t('st_'+o.status),tot(o),o.deposit||0,bal(o)]));dlf(`rapport_${S.from}_${S.to}.csv`,'\uFEFF'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n'))}
else if(a=='bk'){dlf(`patisserie_${T()}.json`,JSON.stringify({orders:S.orders,products:S.products,set:S.set,coffees:S.coffees,sales:S.sales},null,2))}
else if(a=='calc'){S.calc='';S.modal=calcM();render()}
else if(a=='k'){if(id=='C')S.calc='';else if(id=='⌫')S.calc=S.calc.slice(0,-1);else if(id=='='){try{S.calc=String(Function('"use strict";return ('+(S.calc||'0').replace(/[^0-9+\-*/.%]/g,'')+')')())}catch{S.calc='Err'}}else S.calc+=id;if($('#cd'))$('#cd').textContent=S.calc||'0'}
else if(a=='cman'){S.modal=cman();render()}
else if(a=='cnew'){const name=$('#cn').value.trim(),price=+$('#cp').value||0;if(!name)return toast(t('cerr'));const c={id:uid(),name,price};S.coffees.push(c);await put('coffees',c);S.modal=cman();render()}
else if(a=='cedit'){const c=S.coffees.find(x=>x.id==id);if(c){S.modal=cman();render();setTimeout(()=>{$('#cn').value=c.name;$('#cp').value=c.price;$('#cn').dataset.eid=c.id},0)}}
else if(a=='cdel2'){await del('coffees',id);S.coffees=S.coffees.filter(x=>x.id!=id);S.modal=cman();render()}
else if(a=='cadd'){const c=S.coffees.find(x=>x.id==id);if(!c)return;const f=S.tk.find(x=>x.id==c.id);if(f)f.qty++;else S.tk.push({id:c.id,name:c.name,price:c.price,qty:1});render()}
else if(a=='cq'){const it=S.tk[id];if(!it)return;it.qty+=+b.dataset.d;if(it.qty<=0)S.tk.splice(id,1);render()}
else if(a=='cclr'){S.tk=[];render()}
else if(a=='csave')await saveSale(0);else if(a=='csp')await saveSale(1);
else if(a=='tkt'){const s=S.sales.find(x=>x.id==id);if(s)prt(s)}
else if(a=='sdel')ask(t('sure'),async()=>{await del('sales',id);S.sales=S.sales.filter(x=>x.id!=id);S.modal='';render()})});
document.addEventListener('input',e=>{const el=e.target,i=el.dataset.i,k=+el.dataset.k,p=el.dataset.p,s=el.dataset.s;
if(i=='sq'){S.sq=el.value;render()}else if(i=='pq'){S.pq=el.value;render()}else if(i=='dd'){S.dd=el.value;render()}
else if(i=='from'){S.from=el.value;render()}else if(i=='to'){S.to=el.value;render()}else if(i=='cd'){S.cd=el.value;render()}
else if(S.dr&&(i=='name'||i=='phone'||i=='date'||i=='due'||i=='note'))S.dr[i]=el.value;
else if(S.dr&&(i=='discount'||i=='deposit')){S.dr[i]=+el.value||0;upd()}
else if(S.dr&&(i=='qty'||i=='price')){S.dr.items[k][i]=+el.value||0;upd()}
else if(S.pf&&p){S.pf[p]=p=='price'?+el.value||0:el.value}
else if(s){S.set[s]=el.value;clearTimeout(syncTimer);syncTimer=setTimeout(saveSet,400)}
else if(el.dataset.t){S.set.tc=S.set.tc||{};S.set.tc[el.dataset.t]=el.value;applyTheme();clearTimeout(syncTimer);syncTimer=setTimeout(saveSet,400)}
else if(el.dataset.qc){const q=+$('[data-qc="0"]')?.value||0,pr=+$('[data-qc="1"]')?.value||0;if($('#qr'))$('#qr').textContent=fm(q*pr)}});
document.addEventListener('change',async e=>{const el=e.target,c=el.dataset.c,k=+el.dataset.k;
if(c=='st'){const o=S.orders.find(x=>x.id==el.dataset.id);if(o){o.status=el.value;await put('orders',o);render()}}
else if(c=='pid'&&S.dr){const pr=S.products.find(x=>x.id==el.value);S.dr.items[k].pid=el.value;if(pr){S.dr.items[k].name=pr.name;S.dr.items[k].price=pr.price;S.dr.items[k].img=pr.img||'';render()}}
else if(c=='photo'&&S.pf){const u=await shrink(el.files[0]);S.pf.img=u;if($('#pimg')){$('#pimg').src=u}}
else if(c=='logo'){const u=await shrink(el.files[0],240);S.set.logo=u;await saveSet();render()}
else if(el.dataset.v){const v=el.dataset.v;S.set.iv=S.set.iv||{};S.set.iv[v]=el.type=='checkbox'?el.checked:(+el.value||el.value);applyTheme();await saveSet();if(v=='fs')render()}
else if(c=='restore'){const f=el.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(Array.isArray(d.products)){S.products=d.products;for(const x of d.products)await put('products',x)}if(Array.isArray(d.orders)){S.orders=d.orders;for(const x of d.orders)await put('orders',x)}if(Array.isArray(d.coffees)){S.coffees=d.coffees;for(const x of d.coffees)await put('coffees',x)}if(Array.isArray(d.sales)){S.sales=d.sales;for(const x of d.sales)await put('sales',x)}if(d.set){S.set={...S.set,...d.set};await saveSet()}render();toast(t('save'))}catch{toast(t('err'))}}});
initSupabase();
</script></body></html>
